<div th:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Category list</h1>
            <a href="/admin/categories/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Create new category
            </a>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Search</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/categories}" method="get" class="form-inline">
                    <div class="form-group mr-3">
                        <input type="text" class="form-control" name="keyword" 
                               th:value="${keyword}" placeholder="Search by name...">
                    </div>
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <a th:href="@{/admin/categories}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Clear filters
                    </a>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Category list</h6>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(categories)}" class="text-center py-4">
                    <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                    <p class="text-muted">No categories found. <a th:href="@{/admin/categories/create}">Create the first category</a></p>
                </div>
                
                <div th:if="${!#lists.isEmpty(categories)}" class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Number of tasks</th>
                                <th>Created Date</th>
                                <th>Updated Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category, iterStat : ${categories}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${category.name}"></td>
                                <td th:text="${#lists.size(category.tasks)}"></td>
                                <td th:text="${#temporals.format(category.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(category.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}" 
                                          method="post" style="display: inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this category?')">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${totalPages > 1}" class="d-flex justify-content-center">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/categories(page=${currentPage - 1}, size=${size}, keyword=${keyword})}">Previous</a>
                            </li>
                            
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                                th:classappend="${pageNum == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/categories(page=${pageNum}, size=${size}, keyword=${keyword})}"
                                   th:text="${pageNum}"></a>
                            </li>
                            
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/categories(page=${currentPage + 1}, size=${size}, keyword=${keyword})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>

                <div th:if="${totalItems > 0}" class="text-center text-muted">
                    Showing <span th:text="${#lists.size(categories)}"></span> 
                    out of <span th:text="${totalItems}"></span> categories
                </div>
            </div>
        </div>
    </div>
</div>
