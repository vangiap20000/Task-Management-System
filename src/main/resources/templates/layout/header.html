<!-- templates/layout/header.html -->
<div th:fragment="header">
    <header class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-semibold" th:text="${pageTitle != null} ? ${pageTitle} : 'Dashboard'">Dashboard</h2>

        <div class="relative">
            <img th:src="@{${#authentication.principal.avatar} != null ? '/uploads/' + ${#authentication.principal.avatar} : 'https://picsum.photos/40'}" onclick="toggleMenu()" id="avatar"/>
            <div id="logoutMenu" class="absolute right-0 mt-2 w-32 bg-white border border-gray-200 rounded shadow-lg hidden z-50">
                <div sec:authorize="isAuthenticated()">
                    <a class="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                    th:href="@{/admin/profile}">
                        Profile
                    </a>
                    <a class="block px-4 py-2 text-gray-700 hover:bg-gray-100"
                    th:href="@{/admin/logout}">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle"></i>
        <span th:text="${warning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="fas fa-info-circle"></i>
        <span th:text="${info}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
