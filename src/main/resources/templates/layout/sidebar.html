<!-- templates/layout/sidebar.html -->
<div th:fragment="sidebar">
    <div class="bg-gray-800 text-white w-64 h-screen flex flex-col">
        <div class="flex items-center justify-center h-16 mt-1 mb-2">
            <h1 class="text-xl font-bold flex align-items-center">
                <img th:src="@{/images/logo_training.jpg}" alt="logo" class="w-10 rounded-full mr-2"> Admin
            </h1>
        </div>
        <nav class="flex-grow">
            <ul>
                <li class="flex items-center py-2 px-4 hover:bg-gray-700">
                    <i class="fas fa-tachometer-alt"></i>
                    <a href="#" class="ml-2">Dashboard</a>
                </li>

                <!-- Users (with submenu) -->
                <li class="py-2 px-4 hover:bg-gray-700">
                    <div class="flex items-center justify-between cursor-pointer" onclick="toggleSubmenu('userSubmenu')">
                        <div class="flex items-center">
                            <i class="fas fa-users"></i>
                            <span th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? 'text-blue-500 font-semibold' : ''" class="ml-2">
                                Users
                            </span>
                        </div>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <ul id="userSubmenu"
                        class="ml-6 mt-2 transition-all duration-300 overflow-hidden"
                        th:style="${#strings.startsWith(currentPath, '/admin/users')} ? 'display: block;' : 'display: none;'">
                        <li class="py-1">
                            <a th:href="@{/admin/users}"
                            th:classappend="${currentPath == '/admin/users'} ? 'text-blue-400 font-bold underline' : ''">
                                List
                            </a>
                        </li>
                        <li class="py-1">
                            <a th:href="@{/admin/users/create}"
                            th:classappend="${currentPath == '/admin/users/create'} ? 'text-blue-400 font-bold underline' : ''">
                                Create
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="flex items-center py-2 px-4 hover:bg-gray-700">
                    <i class="fas fa-boxes"></i>
                    <a href="/admin/common" class="ml-2">Common</a>
                </li>

                <!-- Logout -->
                <li class="flex items-center py-2 px-4 hover:bg-gray-700" sec:authorize="isAuthenticated()">
                    <i class="fas fa-sign-out-alt"></i>
                    <a th:href="@{/admin/logout}" class="ml-2">Logout</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
