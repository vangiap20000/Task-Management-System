<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
              xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle != null} ? ${pageTitle} : 'Admin Dashboard'">Admin Dashboard</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <th:block th:if="${customCssList != null}">
        <link th:each="css : ${customCssList}" th:href="@{${css}}" rel="stylesheet" />
    </th:block>
</head>
<body class="flex">
    <!-- Sidebar cố định -->
    <div class="fixed top-0 left-0 h-screen w-64 bg-gray-800 text-white flex flex-col z-10">
        <div th:replace="layout/sidebar :: sidebar"></div>
    </div>

    <!-- Phần nội dung -->
    <div class="ml-64 flex-1 p-6 overflow-y-auto h-screen">
        <div th:replace="layout/header :: header"></div>

        <main>
            <div th:insert="${contentPage} :: content"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- <script th:src="@{/js/scripts.js}"></script> -->
    <th:block th:if="${customJsList != null}">
        <script th:each="js : ${customJsList}" th:src="@{${js}}"></script>
    </th:block>
    <script th:src="@{/js/main.js}"></script>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("logoutMenu");
            menu.classList.toggle("hidden");
        }

        document.addEventListener("click", function (e) {
            const avatar = document.getElementById("avatar");
            const menu = document.getElementById("logoutMenu");
            if (!avatar.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add("hidden");
            }
        });

        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            submenu.style.display = submenu.style.display === "block" ? "none" : "block";
        }

        document.addEventListener("DOMContentLoaded", function () {
            flatpickr("#orderStartTime, #orderEndTime", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: true,
                minuteIncrement: 5,
                defaultHour: 8
            });
        });
    </script>
</body>
</html>
