<!-- Icon sort -->
<svg th:fragment="iconSort(type, color)" 
     th:class="'w-3 h-3 ' + ${color}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path th:attr="d=${type == 'asc' ? 'M5 9l7 7 7-7' : 'M5 15l7-7 7 7'}" 
          stroke-linecap="round" stroke-linejoin="round"/>
</svg>
