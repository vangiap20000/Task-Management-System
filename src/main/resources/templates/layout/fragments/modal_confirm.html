<!-- Button trigger -->
<button th:fragment="buttonTrigger(url, class)"
    th:class="'btn-confirm-js ' + ${class}" 
    th:attr="data-url=${url}">Delete</button>

<!-- Modal -->
<div th:fragment="modal" class="modal fade" id="modal-confirm" tabindex="-1" aria-labelledby="modalConfirmLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form action="" class="modal-content border-0 shadow-xl rounded-xl overflow-hidden" method="post">
            <input type="hidden" name="_method" value="delete" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <!-- Modal body -->
            <div class="p-6 bg-white text-gray-800">
                <h4 class="text-lg font-medium mb-2" id="modalConfirmLabel">Are you sure you want to make this change?
                </h4>
            </div>

            <!-- Modal footer -->
            <div class="flex justify-end gap-3 px-6 py-3 bg-gray-50 border-t">
                <button type="button"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded hover:bg-gray-300 transition"
                    data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 transition">
                    Confirm
                </button>
            </div>

        </form>
    </div>
</div>
