<div th:fragment="content">
    <div class="container-fluid">
        <!-- Page Header -->
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800" th:text="${pageTitle}">Category Form</h1>
            <a th:href="@{/admin/categories}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50"></i> Go back
            </a>
        </div>

        <!-- Category Form -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary" th:text="${pageTitle}">Category Form</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/categories/create}" th:object="${category}" method="post">
                    <div class="form-group">
                        <label for="name">Category Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" 
                               th:field="*{name}" th:value="${category.name}"
                               placeholder="Enter category name...">
                        <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                            <small th:errors="*{name}"></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <a th:href="@{/admin/categories}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const categoryId = window.location.pathname.match(/\/edit\/(\d+)/);
            if (categoryId) {
                const form = document.querySelector('form');
                form.action = '/admin/categories/edit/' + categoryId[1];
            }
        });
    </script>
</div>
