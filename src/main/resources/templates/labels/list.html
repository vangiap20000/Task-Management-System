<div th:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Danh sách nhãn</h1>
            <a href="/admin/labels/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Tạo nhãn mới
            </a>
        </div>
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Tìm kiếm</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/labels}" method="get" class="form-inline">
                    <div class="form-group mr-3">
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo tên...">
                    </div>
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fas fa-search"></i> Tìm kiếm
                    </button>
                    <a th:href="@{/admin/labels}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Xóa bộ lọc
                    </a>
                </form>
            </div>
        </div>
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Danh sách nhãn</h6>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(labels)}" class="text-center py-4">
                    <i class="fas fa-tags fa-3x text-muted mb-3"></i>
                    <p class="text-muted">Chưa có nhãn nào. <a th:href="@{/admin/labels/create}">Tạo nhãn đầu tiên</a></p>
                </div>
                <div th:if="${!#lists.isEmpty(labels)}" class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên nhãn</th>
                                <th>Số lượng task</th>
                                <th>Ngày tạo</th>
                                <th>Ngày cập nhật</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="label, iterStat : ${labels}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${label.name}"></td>
                                <td th:text="${#lists.size(label.tasks)}"></td>
                                <td th:text="${#temporals.format(label.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(label.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/admin/labels/edit/{id}(id=${label.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i> Sửa
                                    </a>
                                    <form th:action="@{/admin/labels/delete/{id}(id=${label.id})}" method="post" style="display: inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa nhãn này?')">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-trash"></i> Xóa
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${totalPages > 1}" class="d-flex justify-content-center">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/labels(page=${currentPage - 1}, size=${size}, keyword=${keyword})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" th:classappend="${pageNum == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/labels(page=${pageNum}, size=${size}, keyword=${keyword})}" th:text="${pageNum}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/labels(page=${currentPage + 1}, size=${size}, keyword=${keyword})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div th:if="${totalItems > 0}" class="text-center text-muted">
                    Hiển thị <span th:text="${#lists.size(labels)}"></span> trong tổng số <span th:text="${totalItems}"></span> nhãn
                </div>
            </div>
        </div>
    </div>
</div>
