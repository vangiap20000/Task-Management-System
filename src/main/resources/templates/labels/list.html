<div th:fragment="content">
    <div class="container-fluid">
        <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Label List</h1>
            <a href="/admin/labels/create" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50"></i> Create New Label
            </a>
        </div>
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Search</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/labels}" method="get" class="form-inline">
                    <div class="form-group mr-3">
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by name...">
                    </div>
                    <button type="submit" class="btn btn-primary mr-2">
                        <i class="fas fa-search"></i> Search
                    </button>
                    <a th:href="@{/admin/labels}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Clear Filter
                    </a>
                </form>
            </div>
        </div>
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Label List</h6>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(labels)}" class="text-center py-4">
                    <i class="fas fa-tags fa-3x text-muted mb-3"></i>
                    <p class="text-muted">No labels found. <a th:href="@{/admin/labels/create}">Create the first label</a></p>
                </div>
                <div th:if="${!#lists.isEmpty(labels)}" class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Label Name</th>
                                <th>Task Count</th>
                                <th>Created At</th>
                                <th>Updated At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="label, iterStat : ${labels}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${label.name}"></td>
                                <td th:text="${#lists.size(label.tasks)}"></td>
                                <td th:text="${#temporals.format(label.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(label.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/admin/labels/edit/{id}(id=${label.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/labels/delete/{id}(id=${label.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this label?')">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${totalPages > 1}" class="d-flex justify-content-center">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/labels(page=${currentPage - 1}, size=${size}, keyword=${keyword})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" th:classappend="${pageNum == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/admin/labels(page=${pageNum}, size=${size}, keyword=${keyword})}" th:text="${pageNum}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/labels(page=${currentPage + 1}, size=${size}, keyword=${keyword})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div th:if="${totalItems > 0}" class="text-center text-muted">
                    Showing <span th:text="${#lists.size(labels)}"></span> out of <span th:text="${totalItems}"></span> labels
                </div>
            </div>
        </div>
    </div>
</div>
