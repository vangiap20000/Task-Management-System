<div th:fragment="content">
    <th:block th:replace="layout/fragments/alert :: alertSimpl(${message}, ${messageType})">
    </th:block>
    <form action="#" th:action="@{/admin/tasks/{id}(id=${task.id})}" th:object="${taskFormRequest}" method="post"
        enctype="multipart/form-data" class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <input type="hidden" name="_method" value="put" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" id="deleteFile" th:field="*{deleteFile}" value="0">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Task Information</h2>
        <th:block th:replace="tasks/includes/form :: form">
        </th:block>

        <div class="flex gap-2 justify-end">
            <a th:href="@{/admin/tasks}"
                class="bg-transparent font-semibold py-2 px-4 border  hover:border-transparent rounded inline-flex items-center">
                <th:block th:replace="layout/fragments/icons_svg :: iconBack">
                </th:block>
                Back
            </a>
            <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Save
            </button>
            <th:block
                th:replace="layout/fragments/modal_confirm :: buttonTrigger(url=@{/admin/tasks/{id}(id=${task.id})}, class='px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50')">
            </th:block>
        </div>
    </form>
    <!-- Modal -->
    <th:block th:replace="layout/fragments/modal_confirm :: modal">
    </th:block>
</div>
