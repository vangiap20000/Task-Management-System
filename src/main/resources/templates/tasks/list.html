<div th:fragment="content" th:with="customCssList=${{'/css/task.css'}}">

    <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
        <a href="#"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded inline-flex align-items-center">
            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M8 1a.5.5 0 01.5.5V7h5.5a.5.5 0 010 1H8.5v5.5a.5.5 0 01-1 0V8H2a.5.5 0 010-1h5.5V1.5A.5.5 0 018 1z" />
            </svg>
            Add New Task
        </a>

        <form class="flex gap-2 w-full sm:w-auto search-list">
            <input type="text" placeholder="Search tasks..." name="search_value" th:value="${searchValue}"
                class="w-64 h-10 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:border-blue-500" />
            <div th:replace="layout/fragments/buttons :: submitButton('Search')"></div>
        </form>
    </div>
    <!-- Table -->
    <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 text-sm">
            <thead>
                <tr class="bg-gray-100 text-left text-sm">
                    <th class="px-4 py-2 border cursor-pointer">
                        <a class="flex items-center gap-1"
                            th:with="sortValue=(${sortBy == 'id' && sortValue == 'asc'} ? 'desc' : 'asc')"
                            th:href="'?search_value=' + ${searchValue} + '&sort_by=id&sort_value=' + ${sortValue}">
                            Id
                            <th:block
                                th:with="setColor = (${sortBy == 'id'} ? 'text-blue-800' : 'text-gray-400 opacity-50')">
                                <span
                                    th:replace="layout/fragments/icons_svg :: iconSort(type=${sortValue}, color=${setColor})"></span>
                            </th:block>
                        </a>
                    </th>
                    <th class="px-4 py-2 border cursor-pointer">
                        <a class="flex items-center gap-1"
                            th:with="sortValue=(${sortBy == 'title' && sortValue == 'asc'} ? 'desc' : 'asc')"
                            th:href="'?search_value=' + ${searchValue} + '&sort_by=title&sort_value=' + ${sortValue}">
                            Title
                            <th:block
                                th:with="setColor = (${sortBy == 'title'} ? 'text-blue-800' : 'text-gray-400 opacity-50')">
                                <span
                                    th:replace="layout/fragments/icons_svg :: iconSort(type=${sortValue}, color=${setColor})"></span>
                            </th:block>
                        </a>
                    </th>
                    <th class="px-4 py-2 border cursor-pointer">
                        <a class="flex items-center gap-1"
                            th:with="sortValue=(${sortBy == 'due_date' && sortValue == 'asc'} ? 'desc' : 'asc')"
                            th:href="'?search_value=' + ${searchValue} + '&sort_by=due_date&sort_value=' + ${sortValue}">
                            Due Date
                            <th:block
                                th:with="setColor = (${sortBy == 'due_date'} ? 'text-blue-800' : 'text-gray-400 opacity-50')">
                                <span
                                    th:replace="layout/fragments/icons_svg :: iconSort(type=${sortValue}, color=${setColor})"></span>
                            </th:block>
                        </a>
                    </th>
                    <th class="px-4 py-2 border">Priority</th>
                    <th class="px-4 py-2 border">Status</th>
                    <th class="px-4 py-2 border cursor-pointer">
                        <a class="flex items-center gap-1"
                            th:with="sortValue=(${sortBy == 'created_at' && sortValue == 'asc'} ? 'desc' : 'asc')"
                            th:href="'?search_value=' + ${searchValue} + '&sort_by=created_at&sort_value=' + ${sortValue}">
                            Created At
                            <th:block
                                th:with="setColor = (${sortBy == 'created_at'} ? 'text-blue-800' : 'text-gray-400 opacity-50')">
                                <span
                                    th:replace="layout/fragments/icons_svg :: iconSort(type=${sortValue}, color=${setColor})"></span>
                            </th:block>
                        </a>
                    </th>
                    <th class="px-4 py-2 border">Actions</th>
                </tr>

            </thead>
            <tbody id="myTable">
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 border">1</td>
                    <td class="px-4 py-2 border">Fix login bug</td>
                    <td class="px-4 py-2 border">2025-08-01</td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-blue-700 bg-blue-100 rounded">
                            High
                        </span>
                    </td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-red-700 bg-red-100 rounded">
                            Not Started
                        </span>
                    </td>
                    <td class="px-4 py-2 border">2025-07-26</td>
                    <td class="px-4 py-2 border space-x-2">
                        <button class="px-3 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600">Edit</button>
                        <button class="px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">Delete</button>
                    </td>
                </tr>
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 border">2</td>
                    <td class="px-4 py-2 border">Write documentation</td>
                    <td class="px-4 py-2 border">2025-08-05</td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-blue-700 bg-blue-100 rounded">
                            High
                        </span>
                    </td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-blue-700 bg-blue-100 rounded">
                            In Progress
                        </span>
                    </td>
                    <td class="px-4 py-2 border">2025-07-25</td>
                    <td class="px-4 py-2 border space-x-2">
                        <button class="px-3 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600">Edit</button>
                        <button class="px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">Delete</button>
                    </td>
                </tr>
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 border">3</td>
                    <td class="px-4 py-2 border">Deploy to staging</td>
                    <td class="px-4 py-2 border">2025-08-10</td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-blue-700 bg-blue-100 rounded">
                            High
                        </span>
                    </td>
                    <td class="px-4 py-2 border">
                        <span class="inline-block px-2 py-1 text-xs font-semibold text-green-700 bg-green-100 rounded">
                            Completed
                        </span>
                    </td>
                    <td class="px-4 py-2 border">2025-07-20</td>
                    <td class="px-4 py-2 border space-x-2">
                        <button class="px-3 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600">Edit</button>
                        <button class="px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center mt-6">
        <nav class="inline-flex -space-x-px text-sm">
            <a href="#" class="px-3 py-2 border border-gray-300 rounded-l hover:bg-gray-100">&laquo;</a>
            <a href="#" class="px-3 py-2 border border-gray-300 hover:bg-gray-100">1</a>
            <a href="#" class="px-3 py-2 border border-gray-300 hover:bg-gray-100">2</a>
            <a href="#" class="px-3 py-2 border border-gray-300 hover:bg-gray-100">3</a>
            <a href="#" class="px-3 py-2 border border-gray-300 rounded-r hover:bg-gray-100">&raquo;</a>
        </nav>
    </div>
</div>
